# ============================================================================
# CellFoundry — Organoid Growth Multi-Objective Optimization
# ============================================================================
#
# This config optimizes TWO objectives simultaneously:
#   1. Organoid size curve (equivalent_sphere_radius vs time → target CSV)
#   2. Final alive-cell count (→ target 15 cells)
#
# Optuna uses NSGA-II to maintain a Pareto front of trade-off solutions.
#
# IMPORTANT: organoid_error reads ORGANOID_METRICS_OVER_TIME from
#            the pickle, so ORGANOID_ASSAY and SAVE_PICKLE must be true.
#            For the VTK-based variant, use organoid_error_vtk instead.
#
# Usage:
#    python -m optimizer.optimize --config optimizer/optuna_config_organoid.yaml
# ============================================================================

study:
  name: "cellfoundry_organoid_growth"
  n_trials: 200
  sampler: NSGA-II             # auto-selected for multi-obj, but explicit here
  seed: 42
  directions: [minimize, minimize]   # one per objective
  storage: "sqlite:///cellfoundry_organoid.db"

# --- Multiple objectives (Pareto multi-objective) -------------------------
objectives:
  - function: organoid_error
    reference: "optimizer/reference_data/target_organoid_equiv_sphere.csv"
    kwargs:
      metric: equivalent_sphere_radius   # or: max_span, equivalent_sphere_radius, sphericity
      # smooth_window: 0           # optional Savitzky-Golay smoothing

  - function: final_cell_count_error
    reference: "optimizer/reference_data/target_cell_count.csv"
    kwargs:
      normalize: true              # average error across target rows
      use_relative_error: true     # average % errors (better when type populations differ in magnitude)

# --- Parameters to tune ----------------------------------------------------
parameters:

  N_CELLS:
    type: int
    low: 3
    high: 42
    log: false

  CELL_SPEED_REF:
    type: float
    low: 0.0001
    high: 0.01
    log: true

  DIVISION_RATE_MULTIPLIER:
    type: array_float
    elements:
      0: {low: 0.1, high: 10.0}
      1: {low: 0.1, high: 10.0}
      2: {low: 0.1, high: 10.0}


# --- Model execution settings ----------------------------------------------
model:
  result_dir: "optuna_organoid_results"   # inside optimizer/
  timeout: 0
  cleanup_trials: false

  extra_overrides:
    STEPS: 240
    TIME_STEP: 1800
    SAVE_EVERY_N_STEPS: 12
    INCLUDE_CELLS: true
    INCLUDE_CELL_CELL_INTERACTION: true
    INCLUDE_CELL_CYCLE: true
    INCLUDE_FOCAL_ADHESIONS: false
    DEAD_CELLS_DISAPPEAR: false
    PERIODIC_BOUNDARIES_FOR_CELLS: false
    INCLUDE_CELL_FNODE_REPULSION: false
    INCLUDE_FIBRE_NETWORK: false
    INCLUDE_NETWORK_REMODELING: false
    INCLUDE_DIFFUSION: false
    INCLUDE_CHEMOTAXIS: false
    INCLUDE_CHEMOKINESIS: false
    ORGANOID_ASSAY: true
    ORGANOID_INIT_RADIUS: 10.0
    VISUALISATION: false
    SHOW_PLOTS: false
    SAVE_DATA_TO_FILE: false
    SAVE_PICKLE: true


