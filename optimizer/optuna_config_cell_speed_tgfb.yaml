# ============================================================================
# CellFoundry — Per-Cell-Type Speed Optimization Configuration
# ============================================================================
#
# Usage:
#    python -m optimizer.optimize --config optimizer/optuna_config_cell_speed.yaml
#
# This objective compares per-cell-type target_vmean and target_veff values
# against the aggregated population statistics computed from CELL_SPEED_METRICS
# stored in the trial pickle.
#
# IMPORTANT:
#   - SAVE_PICKLE must be true
#   - SAVE_DATA_TO_FILE is not required
#   - Update optimizer/reference_data/target_cell_speed.csv with your targets
#
# ============================================================================

study:
  name: "cellfoundry_cell_speed_tgfb"
  n_trials: 500
  sampler: TPE
  seed: 42
  direction: minimize
  storage: "sqlite:///cellfoundry_cell_speed.db"

objective:
  function: cell_speed_error
  reference: "optimizer/reference_data/target_cell_speed_tgfb.csv"
  kwargs:
    population_stat: median
    include_dead: false
    normalize: true
    min_trajectory_time: 1.0

parameters:
  CELL_SPEED_REF:
    type: array_float
    elements:
      0: {low: 0.0001, high: 0.005}
      1: {low: 0.0001, high: 0.005}
      2: {low: 0.0001, high: 0.005}

  BROWNIAN_MOTION_STRENGTH_FACTOR:
    type: array_float
    elements:
      0: {low: 0.0, high: 10.0}
      1: {low: 0.0, high: 10.0}
      2: {low: 0.0, high: 10.0}

  CHEMOTAXIS_CHI:
    type: array_float
    elements:
      0: {low: 0.0, high: 10.0}
      1: {low: 0.0, high: 10.0}
      2: {low: 0.0, high: 10.0}

  # DIFFUSION_COEFF_MULTI:
  #   type: array_float
  #   elements:
  #     0: {low: 10.0, high: 3000.0}
  #   log: true


model:
  result_dir: "optuna_cell_speed_tgfb_results"
  timeout: 0
  cleanup_trials: false

  extra_overrides:
    STEPS: 200
    SAVE_EVERY_N_STEPS: 20
    PERIODIC_BOUNDARIES_FOR_CELLS: false # if True, veff has no meaning, so should be removed from the target file.
    INCLUDE_CELLS: true
    INCLUDE_CELL_CYCLE: false
    INCLUDE_FIBRE_NETWORK: false
    INCLUDE_FOCAL_ADHESIONS: false
    INCLUDE_DIFFUSION: true
    INCLUDE_DUROTAXIS: false
    INCLUDE_CHEMOTAXIS: true
    VISUALISATION: false
    SHOW_PLOTS: false
    SAVE_DATA_TO_FILE: false
    SAVE_PICKLE: true
